# Blueprint Render — déploiement fiable de l’API (Docker + Uvicorn).
# Dashboard : https://dashboard.render.com → New → Blueprint → connecter ce dépôt.
# Après déploiement, copier l’URL HTTPS (ex. https://auditiq-api.onrender.com) dans
# le front Netlify : AUDITIQ_API_BASE_URL_PRODUCTION = https://…onrender.com/api

services:
  - type: web
    name: auditiq-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /health
