# Netlify defaults to a very new Python (e.g. 3.14) when unset. pydantic-core then
# builds from source and requires Rust. Pin 3.12 so binary wheels install cleanly.
#
# Important: Netlify is mainly static sites + serverless functions. It does NOT run
# `uvicorn` as a daemon. For a normal FastAPI URL (uvicorn + WebSockets), use
# Render, Railway, Fly.io, or Google Cloud Run instead — see backend/.env.example.
#
# If the repo root IS this backend folder, a typical Netlify *build* step is only:
[build]
  command = "pip install -r requirements.txt"
  # Add `publish = "public"` and a minimal `public/index.html` if Netlify requires a publish dir.

[build.environment]
  PYTHON_VERSION = "3.12"

[functions]
  directory = "netlify/functions"
  # Indispensable : sans cela, le zip Lambda ne contient que le fichier de la fonction → import app.* impossible
  included_files = ["app/**"]

# Réécriture vers Mangum : le path vu par FastAPI est normalisé dans auditiq.py (préfixe fonction retiré).
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/auditiq"
  status = 200
  force = true
