# Netlify — API FastAPI via fonction Python (Mangum).
# Si le site pointe vers un monorepo, définir « Base directory » = dossier Back dans l’UI Netlify.

[build]
  # Installe les deps Python du projet avant le packaging des fonctions
  command = "pip install -r requirements.txt"
  publish = "public"

[build.environment]
  PYTHON_VERSION = "3.12"

[functions]
  directory = "netlify/functions"
  # Indispensable : sans cela, le zip Lambda ne contient que le fichier de la fonction → import app.* impossible
  included_files = ["app/**"]

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/auditiq"
  status = 200
  force = true
