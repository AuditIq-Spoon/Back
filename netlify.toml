# Netlify defaults to a very new Python (e.g. 3.14) when unset. pydantic-core then
# builds from source and requires Rust. Pin 3.12 so binary wheels install cleanly.
[build]
  # Static root (fallback); API traffic is rewritten to the Python function below.
  command = "echo Build OK"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  PYTHON_VERSION = "3.12"

# Route all HTTP paths to the FastAPI app (Mangum handler in netlify/functions/server.py).
# Netlify injects the original URL path into the Lambda-style event for Mangum.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
